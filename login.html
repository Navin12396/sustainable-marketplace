<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Sustainable Marketplace</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <div class="container">
        <nav>
          <a href="index.html" class="logo">
            <i class="fas fa-leaf"></i>
            <span>EcoMarket</span>
          </a>
          <a href="index.html" class="btn btn-secondary">
            <i class="fas fa-arrow-left"></i> Back to Home
          </a>
        </nav>
      </div>
    </header>

    <main class="container">
      <div class="form-container">
        <h1
          style="
            text-align: center;
            margin-bottom: 2rem;
            color: var(--primary-green);
          "
        >
          Login to Your Account
        </h1>

        <form id="loginForm">
          <div class="form-group">
            <label for="email"
              ><i class="fas fa-envelope"></i> Email Address</label
            >
            <input
              type="email"
              id="email"
              class="form-control"
              placeholder="Enter your email"
              required
            />
          </div>

          <div class="form-group">
            <label for="password"><i class="fas fa-lock"></i> Password</label>
            <input
              type="password"
              id="password"
              class="form-control"
              placeholder="Enter your password"
              required
            />
          </div>

          <div class="form-group">
            <button
              type="submit"
              class="btn btn-primary"
              style="width: 100%; padding: 12px"
            >
              <i class="fas fa-sign-in-alt"></i> Login
            </button>
          </div>

          <div style="text-align: center; margin-top: 1rem">
            <p>
              Don't have an account?
              <a href="register.html" style="color: var(--primary-green)"
                >Register here</a
              >
            </p>
            <p>
              Register as NGO?
              <a href="ngo-register.html" style="color: var(--primary-green)"
                >NGO Registration</a
              >
            </p>
          </div>
        </form>
      </div>
    </main>

    <footer>
      <div class="container">
        <div class="copyright">
          <p>
            &copy; 2024 Sustainable Community Marketplace. All rights reserved.
          </p>
        </div>
      </div>
    </footer>

    <script src="https://www.gstatic.com/firebasejs/7.14.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/7.14.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/7.14.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/7.14.0/firebase-storage.js"></script>
    
    <script src="script.js"></script>
  </body>
</html>
