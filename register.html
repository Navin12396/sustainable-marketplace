<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - Sustainable Marketplace</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <div class="container">
        <nav>
          <a href="index.html" class="logo">
            <i class="fas fa-leaf"></i>
            <span>EcoMarket</span>
          </a>
          <a href="index.html" class="btn btn-secondary">
            <i class="fas fa-arrow-left"></i> Back to Home
          </a>
        </nav>
      </div>
    </header>

    <main class="container">
      <div class="form-container">
        <h1><i class="fas fa-user-plus"></i> Create Account</h1>

        <form id="registerForm">
          <div class="form-group">
            <label for="name"><i class="fas fa-user"></i> Full Name *</label>
            <input
              type="text"
              id="name"
              class="form-control"
              placeholder="Enter your full name"
              required
            />
          </div>

          <div class="form-group">
            <label for="email"
              ><i class="fas fa-envelope"></i> Email Address *</label
            >
            <input
              type="email"
              id="email"
              class="form-control"
              placeholder="Enter your email"
              required
            />
          </div>

          <div class="form-group">
            <label for="password"><i class="fas fa-lock"></i> Password *</label>
            <input
              type="password"
              id="password"
              class="form-control"
              placeholder="Create a password"
              required
              minlength="6"
            />
            <small style="color: #666; display: block; margin-top: 5px"
              >Minimum 6 characters</small
            >
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="phone"
                ><i class="fas fa-phone"></i> Phone Number</label
              >
              <input
                type="tel"
                id="phone"
                class="form-control"
                placeholder="Enter phone number"
              />
            </div>

            <div class="form-group">
              <label for="location"
                ><i class="fas fa-map-marker-alt"></i> Location</label
              >
              <input
                type="text"
                id="location"
                class="form-control"
                placeholder="City, State"
              />
            </div>
          </div>

          <div
            class="form-group"
            style="
              background: var(--light-green);
              padding: 1rem;
              border-radius: var(--border-radius);
            "
          >
            <p style="margin: 0; color: var(--primary-green)">
              <i class="fas fa-info-circle"></i>
              By registering, you agree to our Terms of Service and Privacy
              Policy
            </p>
          </div>

          <div class="form-group">
            <button
              type="submit"
              class="btn btn-primary"
              style="width: 100%; padding: 12px"
            >
              <i class="fas fa-user-plus"></i> Create Account
            </button>
          </div>

          <div style="text-align: center; margin-top: 1rem">
            <p>
              Already have an account?
              <a href="login.html" style="color: var(--primary-green)"
                >Login here</a
              >
            </p>
            <p>
              Register as NGO?
              <a href="ngo-register.html" style="color: var(--primary-green)"
                >NGO Registration</a
              >
            </p>
          </div>
        </form>
      </div>
    </main>

    <footer>
      <div class="container">
        <div class="copyright">
          <p>
            &copy; 2024 Sustainable Community Marketplace. All rights reserved.
          </p>
        </div>
      </div>
    </footer>

    <!-- Firebase SDK -->
    <footer>
      </footer>

    <script src="https://www.gstatic.com/firebasejs/7.14.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/7.14.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/7.14.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/7.14.0/firebase-storage.js"></script>

    <script src="script.js"></script>
  </body>
</html>
